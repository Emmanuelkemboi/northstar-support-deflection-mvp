<svg width="680" height="330" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Returns and refunds decision tree</title>
<desc>Flowchart showing how the chatbot handles returns and refunds questions, branching into three sub-intents: how to return, refund status, and return policy.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="210" y="40" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="62" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#2C2C2A">Customer asks about returns</text>
<line x1="340" y1="84" x2="340" y2="120" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="120" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#0C447C">Ask which sub-topic</text>
<text x="340" y="156" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Shows 3 quick replies</text>

<path d="M340 176 L340 205 L140 205 L140 230" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 176 L340 205 L340 205 L340 230" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 176 L340 205 L540 205 L540 230" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="230" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="248" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#085041">How to return</text>
<text x="140" y="266" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Send instructions</text>

<rect x="250" y="230" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="248" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#0C447C">Refund status</text>
<text x="340" y="266" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Check order, then reply</text>

<rect x="450" y="230" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="540" y="248" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" fill="#085041">Return policy</text>
<text x="540" y="266" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Share 30-day policy</text>
</svg>
